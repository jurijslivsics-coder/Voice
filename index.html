<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Голосовой Claude</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #e8e6f0;
  font-family: Georgia, serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px;
}
.container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
h1 { text-align: center; font-size: 16px; letter-spacing: 0.2em; color: #c084fc; font-family: sans-serif; font-weight: 300; text-transform: uppercase; padding: 10px 0; }
.card { background: #12121a; border: 1px solid rgba(124,106,247,0.25); border-radius: 14px; padding: 16px; }
label { font-size: 10px; letter-spacing: 0.12em; color: #6b6880; text-transform: uppercase; font-family: sans-serif; display: block; margin-bottom: 8px; }
.row { display: flex; gap: 8px; }
input[type=password], input[type=text] {
  flex: 1; background: #1a1a28; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; padding: 10px 12px; color: #e8e6f0; font-size: 13px; outline: none; font-family: monospace;
}
.btn { background: #7c6af7; border: none; border-radius: 8px; padding: 10px 14px; color: white; font-size: 10px; letter-spacing: 0.08em; cursor: pointer; font-family: sans-serif; text-transform: uppercase; white-space: nowrap; }
.status-box { font-size: 12px; padding: 6px 10px; border-radius: 6px; margin-top: 8px; display: none; }
.ok { background: rgba(74,222,128,0.1); color: #4ade80; display: block; }
.err { background: rgba(248,113,113,0.1); color: #f87171; display: block; }
.chat { min-height: 150px; max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; flex-direction: column; max-width: 88%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot { align-self: flex-start; }
.lbl { font-size: 9px; color: #6b6880; text-transform: uppercase; font-family: sans-serif; margin-bottom: 3px; letter-spacing: 0.1em; }
.bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; }
.user .bubble { background: linear-gradient(135deg,#7c6af7,#c084fc); color: white; border-bottom-right-radius: 3px; }
.bot .bubble { background: #1a1a28; border: 1px solid rgba(255,255,255,0.07); border-bottom-left-radius: 3px; }
.transcript { background: #12121a; border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #6b6880; font-style: italic; min-height: 36px; }
.orb-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; }
.orb { width: 76px; height: 76px; border-radius: 50%; border: none; cursor: pointer; font-size: 26px; background: linear-gradient(135deg,#7c6af7,#c084fc); box-shadow: 0 0 25px rgba(124,106,247,0.35); transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
.orb.listening { background: linear-gradient(135deg,#f87171,#fb923c); box-shadow: 0 0 35px rgba(248,113,113,0.5); }
.orb.thinking { background: linear-gradient(135deg,#06b6d4,#7c6af7); }
.orb.speaking { background: linear-gradient(135deg,#06b6d4,#7c6af7); box-shadow: 0 0 35px rgba(6,182,212,0.4); }
.status-txt { font-size: 11px; letter-spacing: 0.1em; color: #6b6880; text-transform: uppercase; font-family: sans-serif; text-align: center; }
.controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.ctrl { display: flex; flex-direction: column; gap: 4px; }
.ctrl label { font-size: 9px; }
select { background: #12121a; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 7px 10px; color: #e8e6f0; font-size: 12px; outline: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Голосовой Claude</h1>

  <div class="card">
    <label>API ключ Anthropic (sk-ant-api03-...)</label>
    <div class="row">
      <input type="text" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off">
      <button class="btn" onclick="saveKey()">Сохранить</button>
    </div>
    <div class="status-box" id="keyStatus"></div>
  </div>

  <div class="card chat" id="chat">
    <div style="text-align:center;color:#6b6880;font-size:13px;padding:20px 0;opacity:0.5">
      🎙️<br>Нажми на кнопку и говори по-русски
    </div>
  </div>

  <div class="transcript" id="transcript">Распознанный текст появится здесь...</div>

  <div class="orb-wrap">
    <button class="orb" id="orb" onclick="toggleMic()">🎙️</button>
    <div class="status-txt" id="statusTxt">Нажми чтобы говорить</div>
    <div class="controls">
      <div class="ctrl">
        <label>Голос</label>
        <select id="voiceSel"></select>
      </div>
      <div class="ctrl">
        <label>Скорость</label>
        <select id="rateSel">
          <option value="0.8">0.8×</option>
          <option value="1.0" selected>1.0×</option>
          <option value="1.2">1.2×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>
    </div>
  </div>
</div>

<script>
var voices = [];
var history = [];
var recognition = null;
var state = 'idle';

// Load saved key
var saved = localStorage.getItem('ckey');
if (saved) { document.getElementById('apiKey').value = saved; showKeyStatus('ok', '✓ Ключ загружен'); }

function showKeyStatus(type, msg) {
  var el = document.getElementById('keyStatus');
  el.className = 'status-box ' + type;
  el.textContent = msg;
}

function saveKey() {
  var k = document.getElementById('apiKey').value.trim();
  if (!k || k.length < 20) { showKeyStatus('err', '✗ Неверный ключ'); return; }
  localStorage.setItem('ckey', k);
  showKeyStatus('ok', '✓ Ключ сохранён! Длина: ' + k.length + ' символов');
}

// Voices
function loadVoices() {
  var all = speechSynthesis.getVoices();
  voices = all.filter(function(v){ return v.lang.indexOf('ru') === 0; });
  if (voices.length === 0) voices = all;
  var sel = document.getElementById('voiceSel');
  sel.innerHTML = '';
  voices.forEach(function(v, i) {
    var o = document.createElement('option');
    o.value = i; o.textContent = v.name; sel.appendChild(o);
  });
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function setState(s) {
  state = s;
  var orb = document.getElementById('orb');
  orb.className = 'orb ' + s;
  var texts = { idle:'Нажми чтобы говорить', listening:'Слушаю...', thinking:'Думаю...', speaking:'Говорю...' };
  document.getElementById('statusTxt').textContent = texts[s] || '';
  var emojis = { idle:'🎙️', listening:'⏹', thinking:'⏳', speaking:'🔊' };
  orb.textContent = emojis[s] || '🎙️';
}

function toggleMic() {
  if (state === 'speaking') { speechSynthesis.cancel(); setState('idle'); return; }
  if (state === 'listening') { if(recognition) recognition.stop(); setState('idle'); return; }
  if (state === 'thinking') return;
  var k = localStorage.getItem('ckey');
  if (!k) { showKeyStatus('err', '✗ Сначала введи и сохрани API ключ!'); return; }
  startMic();
}

function startMic() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Распознавание речи не поддерживается. Используй Chrome.'); return; }
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.onresult = function(e) {
    var interim = '', final = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    document.getElementById('transcript').textContent = final || interim;
    if (final) { recognition.stop(); sendToAPI(final.trim()); }
  };
  recognition.onerror = function(e) { addMsg('bot', 'Ошибка микрофона: ' + e.error); setState('idle'); };
  recognition.onend = function() { if (state === 'listening') setState('idle'); };
  recognition.start();
  setState('listening');
}

function addMsg(role, text) {
  var chat = document.getElementById('chat');
  var empty = chat.querySelector('div[style]');
  if (empty) empty.remove();
  var d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  d.innerHTML = '<div class="lbl">' + (role === 'user' ? 'Ты' : 'Claude') + '</div><div class="bubble">' + text + '</div>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function sendToAPI(text) {
  addMsg('user', text);
  setState('thinking');
  history.push({ role: 'user', content: text });
  var k = localStorage.getItem('ckey');
  
  try {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': k,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: 'Ты голосовой ассистент. Отвечай коротко по-русски, без markdown, только живая речь. Максимум 3-4 предложения.',
        messages: history
      })
    });
    
    var data = await res.json();
    
    if (data.error) {
      addMsg('bot', 'Ошибка API: ' + data.error.message + ' (тип: ' + data.error.type + ')');
      setState('idle');
      return;
    }
    
    var reply = data.content && data.content[0] ? data.content[0].text : 'Нет ответа';
    history.push({ role: 'assistant', content: reply });
    addMsg('bot', reply);
    speak(reply);
    
  } catch(err) {
    addMsg('bot', 'Ошибка запроса: ' + err.message);
    setState('idle');
  }
}

function speak(text) {
  speechSynthesis.cancel();
  var utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'ru-RU';
  var idx = parseInt(document.getElementById('voiceSel').value) || 0;
  var rate = parseFloat(document.getElementById('rateSel').value);
  if (voices[idx]) utt.voice = voices[idx];
  utt.rate = rate;
  utt.onstart = function() { setState('speaking'); };
  utt.onend = utt.onerror = function() { setState('idle'); };
  speechSynthesis.speak(utt);
}
</script>
</body>
</html>
